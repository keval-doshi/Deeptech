{% extends "_auth_layout.html" %}
{% from "_macros.html" import icon, field_error %}
{% block title %}Choose a new password{% endblock %}
{% block form %}
<h1 class="mt-2">Choose a new password</h1>
<form method="post" data-validate novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field {% if errors.password %}has-error{% endif %}"><label for="password" class="required">New password</label><input id="password" name="password" type="password" required minlength="10" autocomplete="new-password">{{ field_error(errors, 'password') }}</div>
  <div class="field {% if errors.confirm_password %}has-error{% endif %}"><label for="confirm_password" class="required">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" required data-match="password" autocomplete="new-password">{{ field_error(errors, 'confirm_password') }}</div>
  <button class="btn btn-primary btn-lg btn-block" type="submit">Update password</button>
</form>
{% endblock %}
